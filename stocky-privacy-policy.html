<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stocky - Gizlilik Politikası</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/policy.css">
    <link rel="icon" type="image/png" sizes="32x32" href="app_logo/stocky_logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        .markdown-body table {
            width: 100%;
            border-collapse: collapse;
            margin: 1.5rem 0;
            font-size: 0.95rem;
        }

        .markdown-body table th,
        .markdown-body table td {
            border: 1px solid var(--border-color);
            padding: 0.75rem;
            text-align: left;
        }

        .markdown-body table th {
            background-color: var(--card-bg);
            font-weight: 600;
        }

        .markdown-body a:not(.back-link) {
            color: var(--primary-color);
            text-decoration: none;
        }

        .markdown-body a:not(.back-link):hover {
            text-decoration: underline;
        }

        .markdown-body hr {
            border: none;
            border-top: 1px solid var(--border-color);
            margin: 2rem 0;
        }

        .markdown-body strong {
            font-weight: 600;
            color: var(--text-primary);
        }

        .app-highlight-box {
            background-color: var(--card-bg);
            padding: 1.25rem;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
            margin: 1.5rem 0;
        }
    </style>
</head>

<body class="policy-page">
    <header class="site-header">
        <div class="container header-inner">
            <a href="index.html" class="brand-logo">
                <img src="other_icons/swanky_logo.png?v=3" alt="Logo" width="32" height="32"
                    style="border-radius: 6px;">
                Swanky Software
            </a>
            <nav class="header-nav"></nav>
        </div>
    </header>

    <div class="page-wrapper">
        <div class="container policy-layout">
            <aside class="toc-sidebar">
                <a href="https://play.google.com/store/apps/details?id=com.swanky.stocky" target="_blank"
                    class="download-btn-sidebar">
                    <span>Stocky'yi İndir</span>
                </a>
            </aside>
            <article class="content-area markdown-body">
                <a href="index.html" class="back-link" data-i18n="stocky.backLink">←
                    Ana Sayfaya Dön</a>
                <h1>
                    Stocky Gizlilik Politikası</h1>
                <div id="privacyContentContainer">Yükleniyor... / Loading...</div>
            </article>
        </div>
    </div>

    <footer class="site-footer">
        <div class="container footer-inner">
            <p>© <span class="current-year">2026</span> Stocky. Swanky Software ürünüdür.</p>
        </div>
    </footer>

    <script src="js/i18n.js"></script>
    <script src="js/common.js"></script>
    <script src="js/stocky-i18n.js"></script>
</body>

</html>
